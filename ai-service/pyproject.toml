[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "T20", "ERA001", "C901", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"app/weather/daily_summary.py" = ["PLR2004"]
"app/weather/open_meteo_client.py" = ["PLR2004"]
"app/weather/rules/hutton.py" = ["PLR2004"]
"app/weather/rules/tomcast.py" = ["C901", "ERA001", "PLR2004"]
"scripts/download_model.py" = ["T20"]
"tests/test_crops.py" = ["PLR2004"]
"tests/test_health.py" = ["PLR2004"]
"tests/test_labels.py" = ["PLR2004"]
"tests/test_predict_mock.py" = ["PLR2004"]
"tests/test_prepare_plantvillage.py" = ["PLR2004"]
"tests/test_risk_mock.py" = ["PLR2004"]
"tests/test_weather_rules.py" = ["N", "PLR2004"]
"tests/test_weather_summary.py" = ["PLR2004"]
"training/check_split_leakage.py" = ["ANN", "T20"]
"training/fetch_images.py" = ["ANN"]
"training/notebooks/baseline_mobilenetv3.ipynb" = ["ANN", "N", "PLR2004", "T20"]
"training/prepare_plantvillage.py" = ["ANN", "C901", "PLR2004"]
"training/train.py" = ["ANN", "C901", "PLR2004", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
