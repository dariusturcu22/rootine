name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
              - '**/Dockerfile'
              - 'scripts/smoke-test.sh'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B spotless:check
      - run: ./mvnw -B verify

  ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Generate a JWT secret for this job only
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check health URLs
        run: |
          set -euo pipefail
          health_urls=(
            "http://localhost:8080/actuator/health"
            "http://localhost:8000/health"
            "http://localhost/"
            "http://localhost/api/actuator/health"
          )
          for health_url in "${health_urls[@]}"; do
            echo "Checking $health_url"
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$health_url" > /dev/null
          done
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  no-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR text and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          patterns=(
            "co-authored-by:"
            "generated with \[?claude"
            "🤖"
            "noreply@anthropic\.com"
            "claude-session:"
            "claude\.ai/code/session"
          )
          found=0

          check() {
            local source="$1" text="$2"
            for pattern in "${patterns[@]}"; do
              if matches=$(printf '%s\n' "$text" | grep -n -i -E -e "$pattern"); then
                while IFS= read -r line; do
                  echo "::error::Forbidden text '$pattern' in $source: $line"
                done <<< "$matches"
                found=1
              fi
            done
          }

          check "PR title" "$PR_TITLE"
          check "PR body" "$PR_BODY"
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            check "commit $sha" "$(git log -1 --format=%B "$sha")"
          done

          if [ "$found" -ne 0 ]; then
            echo "Remove the lines above (see rule 1 in AGENTS.md: no attribution)."
            exit 1
          fi
          echo "No attribution found."

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title (advisory, not part of ci-result yet)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(feat|fix|docs|test|chore|refactor|ci|build|perf|style)\([a-z0-9-]+\)!?: .+'
          if printf '%s' "$PR_TITLE" | grep -q -E "$title_pattern"; then
            echo "PR title follows Conventional Commits with a folder scope."
            exit 0
          fi
          echo "::error::PR title '$PR_TITLE' does not follow 'type(scope): description'."
          echo "Allowed types: feat, fix, docs, test, chore, refactor, ci, build, perf, style."
          echo "Use the folder as scope, for example 'feat(frontend): show the diagnosis result'."
          echo "This check is advisory until after Demo 1. See CONTRIBUTING.md."
          exit 1

  ci-result:
    needs: [changes, frontend, backend, ai-service, compose-smoke, no-attribution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "A job failed or was cancelled."; exit 1 ;;
          esac
          echo "All jobs passed or were skipped."
