name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: team
    attributes:
      label: Part
      options:
        - Frontend
        - Backend
        - AI
        - General
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, logs or screenshots.
    validations:
      required: true
