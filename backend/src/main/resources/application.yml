spring:
  application:
    name: rootine-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rootine}
    username: ${DB_USER:rootine}
    password: ${DB_PASSWORD:rootine_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rootine}
    password: ${RABBITMQ_PASSWORD:rootine_dev_password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  jwt:
    # HMAC secret, at least 32 bytes. No default on purpose: the app must not start without it.
    secret: ${JWT_SECRET:}
  demo-token:
    enabled: ${DEMO_TOKEN_ENABLED:false}
  risk-refresh:
    # Daily weather-risk refresh. Schedule is configuration, not business logic.
    enabled: ${RISK_REFRESH_ENABLED:true}
    cron: ${RISK_REFRESH_CRON:0 0 6 * * *}
    zone: ${RISK_REFRESH_ZONE:UTC}
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  ai-service-connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:2s}
  ai-service-read-timeout: ${AI_SERVICE_READ_TIMEOUT:30s}
  mail-from: ${MAIL_FROM:no-reply@rootine.local}
  alert:
    enabled: ${ALERT_ENABLED:true}
    exchange: rootine.alerts
    queue: rootine.risk-alerts
    routing-key: rootine.risk-alert
    dead-letter-exchange: rootine.alerts.dead
    dead-letter-queue: rootine.risk-alerts.dead
    dead-letter-routing-key: rootine.risk-alert.dead
