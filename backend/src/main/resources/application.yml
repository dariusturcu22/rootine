spring:
  application:
    name: rootine-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rootine}
    username: ${DB_USER:rootine}
    password: ${DB_PASSWORD:rootine_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rootine}
    password: ${RABBITMQ_PASSWORD:rootine_dev_password}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  jwt:
    # HMAC secret, at least 32 bytes. No default on purpose: the app must not start without it.
    secret: ${JWT_SECRET:}
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  mail-from: ${MAIL_FROM:no-reply@rootine.local}
